---
title: Stuck
description: Release the sword stuck in the stone.
preview: wwo_stuck.png
---

<h1>Release the sword <em>stuck</em> in the stone</h1>

<div class="bigflex">
    <form onsubmit="pull(); return false">
        <details>
            <summary>Need a hint?</summary>
            <p>
                To find the magic word, you must dig deeply among the
                <a href="../layers">layers</a>.
            </p>
        </details>
        <label>Magic word: <br><input type="text" id="magic" maxlength="8" /></label>
    </form>

    <button class="swordbutton" id="swordbutton" onclick="pull()">
        <div id="swordstone">
            <img id="sword" src="/sword.png" />
            <div class="scrim"></div>
            <img src="/stone.png" />
            <div id="winphrase"></div>
        </div>
    </input>
</div>

<script webc:keep>
    function pull() {
        const inputEl = document.getElementById("magic");
        const input = inputEl.value.toLowerCase();
        // No peeking! Check the hint if you need it.
        const magic = atob("U2hyZWs=").toLowerCase();
        const swordstone = document.getElementById("swordstone");
        if (input === magic) {
            swordstone.classList.add("pull");
            document.getElementById("winphrase").innerText = atob(
                // No peeking! Check the hint if you need it.
                "SGV5IG5vdywgeW91J3JlIGFuIEFsbC1TdGFyIQ==",
            );
            inputEl.setAttribute("disabled", "");
            document.getElementById("swordbutton").setAttribute("disabled", "");
        } else {
            swordstone.classList.add("shake");
            inputEl.value = "";
            setTimeout(() => {
                swordstone.classList.remove("shake");
            }, 500);
        }
    }
</script>
